# PBZStatsHUD configuration
# lang: auto (follow the game) or zh / zht / en / ja / ko / fr / de / es / pt / ru / it / th / vi
lang=auto
# settings_hotkey: global hotkey that opens the settings page (needs at least one modifier, e.g. Ctrl+F8)
settings_hotkey=Ctrl+F8
# hidden_rows: rows hidden in the HUD, comma separated, 0 = first line (cycle)
hidden_rows=
# auto_rows: rows shown only while a boss fight is running, comma separated
# (3 = current boss, 4 = deaths to that boss). Empty = every row is always shown.
auto_rows=3,4
# ui_lang: language of the tray menu, tooltip and balloon
#   os = follow the Windows display language (default)
#   game = follow the in-game language
ui_lang=os
# data_dir: empty = the data folder next to this exe (data\)
data_dir=
# layout, measured from the right edge of the game window
# align: text alignment inside the HUD - right (hug the right edge) or left
align=right
margin_right=40
offset_y=0
font_size=26
line_gap=8
gap=14
# long boss names are cut with "..." once they exceed this pixel width
max_value_width=620
label_color=#F2F2F2
value_color=#E8C36A
shadow_color=#000000
poll_ms=250
stale_ms=15000
# hud_mode: ps (PowerShell host, no exe) | exe (compiled overlay) | both | none
hud_mode=ps
